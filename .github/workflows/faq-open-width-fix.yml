name: FAQ open width fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match FAQ width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site-enhancements.css')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('.faq-section .faq-list{width:690px!important;', '.faq-section .faq-list{width:650px!important;', 1)
          if s2 == s:
              raise SystemExit('FAQ width rule not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-enhancements.css
          git commit -m 'Set FAQ open card width to 650px'
          git push
