name: Social icon size fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix social icon size') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append social icon override
        run: |
          cat >> site-enhancements.css <<'EOF'

/* SOCIAL CONTACT ICON SIZE — match the compact Facebook icon scale */
.contact-card .contact-icon {
    width: 38px !important;
    height: 38px !important;
    border-radius: 10px !important;
}
.contact-card .contact-icon i {
    font-size: 17px !important;
}
EOF
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-enhancements.css
          git commit -m 'Fix social icon size'
          git push
