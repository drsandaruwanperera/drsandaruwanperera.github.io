name: Add why select section
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  update-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append section styling
        shell: bash
        run: |
          cat >> site-enhancements.css <<'EOF'

/* WHY SELECT DR. SANDARUWAN PERERA — above Programs */
.programs-section{
  position:relative!important;
  padding-top:430px!important;
}
.programs-section::before{
  content:"WHY YOU SHOULD SELECT\\A Dr. Sandaruwan Perera\\A\\A Quality teaching • Structured learning • Exam-focused preparation • Continuous support";
  white-space:pre;
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:min(1180px,calc(100% - 56px));
  height:235px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:34px;
  box-sizing:border-box;
  text-align:center;
  color:#eef3ff;
  font-size:clamp(30px,4.5vw,54px);
  font-weight:800;
  line-height:1.08;
  letter-spacing:-1.8px;
  background:
    radial-gradient(circle at 12% 18%,rgba(141,107,255,.20) 0 2px,transparent 3px),
    radial-gradient(circle at 88% 26%,rgba(141,107,255,.16) 0 2px,transparent 3px),
    radial-gradient(circle at 50% 78%,rgba(0,230,176,.12) 0 2px,transparent 3px),
    linear-gradient(180deg,#0d1427 0%,#0b1020 100%);
  background-size:180px 180px,220px 220px,160px 160px,100% 100%;
  border-radius:24px;
  text-shadow:0 8px 28px rgba(0,0,0,.28);
  z-index:0;
}
.programs-section::after{
  content:"📚  Structured Learning     ✦  Expert Guidance     ✓  Exam Preparation     ◈  Continuous Assessment     ◉  Model & Past Papers";
  position:absolute;
  top:214px;
  left:50%;
  transform:translateX(-50%);
  width:min(1120px,calc(100% - 72px));
  min-height:86px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 30px;
  box-sizing:border-box;
  text-align:center;
  color:#f2f5ff;
  font-size:clamp(10px,1.25vw,14px);
  font-weight:700;
  line-height:1.7;
  letter-spacing:.1px;
  border-radius:999px;
  background:linear-gradient(100deg,#5132a7 0%,#166e9e 45%,#00a995 100%);
  border:1px solid rgba(141,107,255,.28);
  box-shadow:0 20px 55px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.10);
  z-index:1;
}
@media(max-width:900px){
  .programs-section{padding-top:390px!important}
  .programs-section::before{width:calc(100% - 28px);height:220px;padding:28px 18px 0;font-size:clamp(27px,7vw,42px)}
  .programs-section::after{top:205px;width:calc(100% - 36px);min-height:105px;border-radius:28px;padding:18px 22px;font-size:11px}
}
@media(max-width:620px){
  .programs-section{padding-top:455px!important}
  .programs-section::before{width:calc(100% - 22px);height:285px;padding:28px 14px 0;font-size:clamp(27px,9.5vw,39px);line-height:1.05;border-radius:18px}
  .programs-section::after{top:250px;width:calc(100% - 22px);min-height:150px;border-radius:24px;padding:18px 20px;font-size:11px;line-height:2.05}
}
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-enhancements.css
          git diff --cached --quiet || git commit -m 'Add why select section above programs'
          git push
