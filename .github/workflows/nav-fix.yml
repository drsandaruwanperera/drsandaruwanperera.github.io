name: Nav styling fix
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append nav styling
        run: |
          cat >> site-enhancements.css <<'EOF'

/* NAV — remove white active/hover blocks */
.nav-link,
.nav-link:hover,
.nav-link:focus,
.nav-link.active {
  background: transparent !important;
  color: #f4f6ff !important;
}
.nav-link.active {
  color: #A0FF1A !important;
}
.nav-link.active::after {
  background: #A0FF1A !important;
}
@media (max-width: 900px) {
  .nav-link:hover,
  .nav-link:focus,
  .nav-link.active {
    background: transparent !important;
    color: #f4f6ff !important;
  }
  .nav-link.active { color: #A0FF1A !important; }
}
EOF
      - name: Commit styling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-enhancements.css
          git diff --cached --quiet || git commit -m 'Remove white nav active background'
          git push
