name: FAQ width fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update FAQ width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site-enhancements.css')
          s = p.read_text(encoding='utf-8')
          old = 'width: 650px !important;'
          new = 'width: 652px !important;'
          if old not in s:
              raise SystemExit('Expected FAQ width rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit FAQ width change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-enhancements.css
          git commit -m 'Match FAQ width to reference' || exit 0
          git push
