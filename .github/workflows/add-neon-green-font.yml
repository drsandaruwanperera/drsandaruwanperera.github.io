name: Add neon green font accent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-font-accent:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add neon green font styles
        shell: python
        run: |
          from pathlib import Path
          path = Path('site-enhancements.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* NEON GREEN FONT ACCENT — screenshot inspired */'
          if marker not in text:
              text += '''\n\n/* NEON GREEN FONT ACCENT — screenshot inspired */\n.hero h1 span,\n.eyebrow,\n.section-heading .eyebrow,\n.results-heading .eyebrow,\n.feature-item .feature-icon,\n.nav-link.active {\n    color: #A0FF1A !important;\n}\n.nav-link.active::after {\n    background: #A0FF1A !important;\n}\n''' 
              path.write_text(text, encoding='utf-8')

      - name: Commit font accent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-enhancements.css
          git diff --cached --quiet || git commit -m "Apply neon green font accent"
          git push
